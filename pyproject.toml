[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcface-loom"
version = "0.1.0"
description = "insightface's w600k_r50 (ArcFace iResNet-50) face recogniser in AMD's Loom kernel language for gfx1151"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2.3", "opencv-python>=4.10"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
# Reading the ONNX graph (export, reference) and the oracle (validation, benchmarks).
validate = ["onnx>=1.17", "onnxruntime>=1.20"]

[tool.setuptools]
# The wheel is the pure-Python loader. Device-specific kernels, weights and the
# native library remain external and are located through ARCFACE_LOOM_*.
py-modules = ["arcface_loom", "arcface_loom_align"]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
